<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サロッチ</title>
<style>
:root { color-scheme: light dark; --bg:#fafafa; --card:#ffffff; --text:#171717; --sub:#525252; --muted:#737373; --line:rgba(23,23,23,.12); --accent:#166534; }
@media (prefers-color-scheme: dark) { :root { --bg:#141415; --card:#19191b; --text:#ededed; --sub:#a1a1a6; --muted:#85858b; --line:rgba(237,237,237,.14); --accent:#4ADE80; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.8 -apple-system,"Hiragino Sans","Yu Gothic",sans-serif; }
main { max-width:680px; margin:0 auto; padding:32px 20px 64px; }
h1 { font-size:26px; line-height:1.4; font-weight:600; margin:0 0 8px; }
h2 { font-size:18px; line-height:1.5; font-weight:600; margin:32px 0 8px; }
p { margin:0 0 12px; color:var(--sub); }
.lead { color:var(--text); }
.meta { color:var(--muted); font-size:13px; margin-top:32px; }
a { color:var(--accent); }
nav { margin-top:32px; display:flex; gap:20px; flex-wrap:wrap; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin:16px 0; }
footer { margin-top:48px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
<h1>サロッチ</h1>
<p class="lead">岩手県（主に盛岡市とその周辺）の美容室・理容室の新店や求人を、短いニュースで読める iPhone アプリです。</p>

<nav><a href="support.html">サポート・お問い合わせ</a><a href="privacy.html">プライバシーポリシー</a></nav>
<p class="meta">運営者: RYO DOMI（個人）　連絡先: <a href="mailto:salotchi.contact@gmail.com">salotchi.contact@gmail.com</a></p>
<footer>サロッチ（Salotchi）は、Meta・Instagram・Google・ホットペッパービューティーなどとは関係のない、個人が運営するアプリです。</footer>
</main>
</body>
</html>
